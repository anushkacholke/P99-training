<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login Page</h2>

<form id="loginForm">
    Username: <input type="text" id="username" required><br><br>
    Password: <input type="password" id="password" required><br><br>
    <button type="submit">Login</button>
</form>

<button id="dashboardBtn" type="button">Go to Dashboard</button>
<p id="result"></p>

<script>
const loginForm = document.getElementById("loginForm");
const result = document.getElementById("result");
const dashboardBtn = document.getElementById("dashboardBtn");

loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (response.ok) {
        localStorage.setItem("token", data.token);
        result.innerText = "Login Successful! Token saved.";
    } else {
        result.innerText = data.detail || data.message || "Login failed.";
    }
});

dashboardBtn.addEventListener("click", async function() {
    const token = localStorage.getItem("token");
    if (!token) {
        result.innerText = "Please login first.";
        return;
    }

    const response = await fetch("/dashboard", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await response.json();
    if (response.ok) {
        result.innerText = data.message;
    } else {
        result.innerText = data.detail || data.message || "Access denied.";
    }
});
</script>

</body>
</html>
